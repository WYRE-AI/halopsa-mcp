services:
  # Gateway mode. Halo client id, secret, and tenant arrive per request on
  # X-Halo-Client-ID, X-Halo-Client-Secret, and X-Halo-Tenant (or
  # X-Halo-Base-URL). Do not set HALOPSA_CLIENT_ID, HALOPSA_CLIENT_SECRET,
  # HALOPSA_TENANT, HALOPSA_BASE_URL, or env_file here — that would put static
  # vendor credentials in the container. Compose interpolates CONDUIT_S2S_SECRET
  # from the project .env. For AUTH_MODE=env, pass HALOPSA_* on that process
  # instead (see the README).
  halopsa-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ghcr.io/wyre-ai/halopsa-mcp:latest
    container_name: halopsa-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    # 127.0.0.1, not localhost: localhost resolves to ::1 in the container, and
    # the IPv4-only MCP_HTTP_HOST=0.0.0.0 bind refuses that connection. $$ keeps
    # Compose from substituting the port on the host; the container shell reads
    # MCP_HTTP_PORT (default 8080).
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${MCP_HTTP_PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
