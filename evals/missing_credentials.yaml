name: halopsa_agents_list returns is_error when credentials missing
server:
  command: node
  args: [dist/index.js]
  env:
    MCP_TRANSPORT: "stdio"
    AUTH_MODE: "static"
    HALOPSA_BASE_URL: ""
    HALOPSA_CLIENT_ID: ""
    HALOPSA_CLIENT_SECRET: ""
    HALOPSA_TENANT: ""
assert:
  tool: halopsa_agents_list
  args: {}
  expect:
    is_error: true
timeout: 30s
